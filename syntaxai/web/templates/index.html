<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyntaxAI - Terminal AI Programming Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #00d4aa;
        }
        
        .logo::before {
            content: "⌨";
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        select, button {
            background: #333;
            border: 1px solid #444;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        
        select:focus, button:focus {
            outline: 2px solid #00d4aa;
        }
        
        button:hover {
            background: #3c3c3c;
        }
        
        button.primary {
            background: #00d4aa;
            color: #1e1e1e;
            font-weight: 600;
        }
        
        button.primary:hover {
            background: #00e8bb;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            background: #00d4aa;
            color: #1e1e1e;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            border-bottom-left-radius: 4px;
        }
        
        .message.error {
            align-self: flex-start;
            background: #4a1a1a;
            border: 1px solid #ff4444;
            color: #ff8888;
        }
        
        .message.thinking {
            align-self: flex-start;
            background: #2d2d2d;
            border: 1px solid #00d4aa;
            color: #00d4aa;
            font-style: italic;
        }
        
        .message pre {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .message code {
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
        }
        
        .input-area {
            background: #252526;
            border-top: 1px solid #3c3c3c;
            padding: 16px 24px;
        }
        
        .input-container {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        textarea {
            width: 100%;
            min-height: 50px;
            max-height: 200px;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 12px 16px;
            color: #d4d4d4;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }
        
        textarea:focus {
            outline: 2px solid #00d4aa;
        }
        
        textarea::placeholder {
            color: #6a6a6a;
        }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00d4aa;
            border: none;
            color: #1e1e1e;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        
        .send-btn:hover {
            background: #00e8bb;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        .status-bar {
            background: #1e1e1e;
            border-top: 1px solid #3c3c3c;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-dot.connected {
            background: #00d4aa;
        }
        
        .status-dot.disconnected {
            background: #ff4444;
        }
        
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 0 24px 12px;
            flex-wrap: wrap;
        }
        
        .toolbar-btn {
            background: #333;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .toolbar-btn:hover {
            background: #3c3c3c;
            color: #d4d4d4;
        }
        
        .toolbar-btn.active {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #1e1e1e;
        }
        
        @media (max-width: 600px) {
            header, .input-area, .status-bar {
                padding-left: 16px;
                padding-right: 16px;
            }
            
            .chat-container {
                padding: 16px;
            }
            
            .message {
                max-width: 95%;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .send-btn {
                width: 100%;
                height: 44px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SyntaxAI</div>
        <div class="controls">
            <select id="providerSelect">
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek V4</option>
                <option value="nemotron">NVIDIA Nemotron</option>
            </select>
            <select id="modelSelect">
                <option value="">Auto (Default)</option>
            </select>
            <button id="setupApiBtn" class="secondary">Setup API</button>
        </div>
    </header>
    
    <div class="toolbar">
        <button class="toolbar-btn" id="clearBtn" title="Clear conversation">🗑 Clear</button>
        <button class="toolbar-btn" id="helpBtn" title="Show help">❓ Help</button>
        <button class="toolbar-btn" id="skillsBtn" title="Show skills">🔧 Skills</button>
        <button class="toolbar-btn" id="statusBtn" title="Server status">📊 Status</button>
    </div>
    
    <main>
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                Welcome to <strong>SyntaxAI</strong>! I'm your terminal programming assistant.<br>
                Ask me to read files, write code, run commands, or help with git operations.
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="queryInput" 
                        placeholder="Ask SyntaxAI anything... (Shift+Enter for new line, Enter to send)"
                        rows="2"
                    ></textarea>
                </div>
                <button class="send-btn" id="sendBtn" title="Send (Enter)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </main>
    
    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
        <div class="status-item">
            <span id="providerStatus">Provider: gemini</span>
        </div>
    </div>

    <script>
        // Configuration
        const WS_URL = `ws://${window.location.host}/ws`;
        const API_URL = `${window.location.origin}/api`;
        
        // State
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        
        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const providerSelect = document.getElementById('providerSelect');
        const modelSelect = document.getElementById('modelSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const providerStatus = document.getElementById('providerStatus');
        const clearBtn = document.getElementById('clearBtn');
        const helpBtn = document.getElementById('helpBtn');
        const skillsBtn = document.getElementById('skillsBtn');
        const statusBtn = document.getElementById('statusBtn');
        const setupApiBtn = document.getElementById('setupApiBtn');
        
        // Initialize
        init();
        
        function init() {
            connectWebSocket();
            loadModels();
            attachEventListeners();
            autoResizeTextarea();
        }
        
        function attachEventListeners() {
            // Send button
            sendBtn.addEventListener('click', sendQuery);
            
            // Enter to send, Shift+Enter for newline
            queryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendQuery();
                }
            });
            
            // Provider change
            providerSelect.addEventListener('change', () => {
                updateProviderStatus();
                loadModels();
            });
            
            // Toolbar buttons
            clearBtn.addEventListener('click', clearChat);
            helpBtn.addEventListener('click', showHelp);
            skillsBtn.addEventListener('click', showSkills);
            statusBtn.addEventListener('click', showStatus);
            setupApiBtn.addEventListener('click', () => {
                window.location.href = `${API_URL}/setup-api`;
            });
        }
        
        function autoResizeTextarea() {
            queryInput.addEventListener('input', () => {
                queryInput.style.height = 'auto';
                queryInput.style.height = Math.min(queryInput.scrollHeight, 200) + 'px';
            });
        }
        
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                reconnectAttempts = 0;
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
            
            ws.onclose = () => {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected - Reconnecting...';
                attemptReconnect();
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusText.textContent = 'Connection error';
            };
        }
        
        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                setTimeout(connectWebSocket, 1000 * reconnectAttempts);
            } else {
                statusText.textContent = 'Connection failed';
            }
        }
        
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'thinking':
                    addMessage('thinking', data.message);
                    break;
                case 'response':
                    // Replace thinking message with response
                    replaceLastThinking(data.message);
                    break;
                case 'error':
                    replaceLastThinking(data.message, 'error');
                    break;
            }
        }
        
        function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;
            
            // Clear input
            queryInput.value = '';
            queryInput.style.height = 'auto';
            
            // Add user message
            addMessage('user', query);
            
            // Send via WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    query: query,
                    provider: providerSelect.value,
                    model: modelSelect.value || null
                }));
            } else {
                // Fallback to REST API
                sendViaREST(query);
            }
        }
        
        async function sendViaREST(query) {
            addMessage('thinking', 'Processing...');
            
            try {
                const response = await fetch(`${API_URL}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        provider: providerSelect.value,
                        model: modelSelect.value || null
                    })
                });
                
                const data = await response.json();
                replaceLastThinking(data.response, data.success ? 'assistant' : 'error');
            } catch (error) {
                replaceLastThinking(`Error: ${error.message}`, 'error');
            }
        }
        
        function addMessage(type, content) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            // Format content - handle code blocks
            const formatted = formatMessage(content);
            div.innerHTML = formatted;
            
            chatContainer.appendChild(div);
            scrollToBottom();
        }
        
        function replaceLastThinking(content, type = 'assistant') {
            // Find and remove the last thinking message
            const messages = chatContainer.querySelectorAll('.message.thinking');
            if (messages.length > 0) {
                messages[messages.length - 1].remove();
            }
            addMessage(type, content);
        }
        
        function formatMessage(content) {
            // Simple markdown-like formatting for code blocks
            return content
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }
        
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function updateProviderStatus() {
            providerStatus.textContent = `Provider: ${providerSelect.value}`;
        }
        
        async function loadModels() {
            try {
                const response = await fetch(`${API_URL}/config`);
                const data = await response.json();
                
                if (data.providers) {
                    const provider = data.providers.find(p => p.name === providerSelect.value);
                    if (provider) {
                        modelSelect.innerHTML = '<option value="">Auto (Default)</option>';
                        modelSelect.innerHTML += `<option value="${provider.model}">${provider.model} (default)</option>`;
                    }
                }
            } catch (error) {
                console.error('Failed to load models:', error);
            }
        }
        
        function clearChat() {
            chatContainer.innerHTML = '';
            addMessage('assistant', 'Conversation cleared. How can I help you?');
        }
        
        function showHelp() {
            const helpText = `
**SyntaxAI Help**

**Commands:**
- \`read_file(path)\` - Read file contents
- \`write_file(path, content)\` - Write file contents
- \`edit_file(path, old, new)\` - Edit file with diff
- \`list_tree(path, depth)\` - Show directory tree
- \`shell(command)\` - Execute shell command
- \`git_status\` - Show git status
- \`git_diff\` - Show git diff
- \`git_commit(message)\` - Commit changes
- \`git_push(remote, branch)\` - Push to remote

**Shortcuts:**
- Enter: Send message
- Shift+Enter: New line
- Ctrl+L: Clear chat
            `;
            addMessage('assistant', helpText);
        }
        
        function showSkills() {
            addMessage('assistant', 'Skills feature coming soon. Check `.skills/` directory in your project.');
        }
        
        async function showStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();
                addMessage('assistant', `**Server Status:**\n- Version: ${data.version}\n- Agent Ready: ${data.agent_ready}\n- Active Connections: ${data.active_connections}`);
            } catch (error) {
                addMessage('error', `Failed to fetch status: ${error.message}`);
            }
        }
    </script>
</body>
</html>
